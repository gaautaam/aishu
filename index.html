<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Will You Be My Valentine?</title>
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Arial', sans-serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h1 {
      color: #e91e63;
      margin-bottom: 30px;
    }

    button {
      font-size: 18px;
      padding: 12px 30px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      position: relative;
    }

    #yesBtn {
      background-color: #e91e63;
      color: white;
      margin-right: 20px;
    }

    #noBtn {
      background-color: #ccc;
      color: black;
      position: absolute;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Aishu kuttaa. Propose day okke allee. Soo...... 💖<br>Will you be my Valentine?</h1>
    <button id="yesBtn" onclick="yesClicked()">Yes 💘</button>
    <button id="noBtn">No 🙈</button>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");

    noBtn.addEventListener("mouseover", moveButton);
    noBtn.addEventListener("click", moveButton);

    function moveButton() {
      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    function yesClicked() {
      document.body.innerHTML = `
        <div style="
          height:100vh;
          display:flex;
          align-items:center;
          justify-content:center;
          background:linear-gradient(135deg, #ff9a9e, #fad0c4);
          font-family: Arial;
        ">
          <h1 style="color:white; text-align:center;">
            YAYYYY 💖🥰<br>
            Thanks for accepting my humble request kumbalakshmi ! 🥰🥰💕
          </h1>
        </div>
      `;
    }
  </script>

</body>
</html>
